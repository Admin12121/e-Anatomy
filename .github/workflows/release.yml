name: Production Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: anatomy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    outputs:
      release: ${{ steps.release.outputs.release }}
      registry_prefix: ${{ steps.release.outputs.registry_prefix }}

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify tagged commit
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE="${GITHUB_REF_NAME}"
          [[ "${RELEASE}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "${RELEASE}" != "v0.0.0" ]] || {
            echo "Invalid release tag: ${RELEASE}" >&2
            exit 1
          }

          git fetch --force --no-tags origin main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse origin/main)"
          [[ "${TAG_SHA}" == "${MAIN_SHA}" ]] || {
            echo "Release tag must point to current origin/main HEAD." >&2
            echo "tag:  ${TAG_SHA}" >&2
            echo "main: ${MAIN_SHA}" >&2
            exit 1
          }

          echo "release=${RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "registry_prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
          echo "Release: ${RELEASE} (${TAG_SHA})"

  frontend-checks:
    name: Frontend release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: verify-release

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun test

  backend-checks:
    name: Backend release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: verify-release

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Rust format
        run: cargo +1.98.0 fmt --all -- --check

      - name: Rust clippy
        run: cargo +1.98.0 clippy --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo +1.98.0 test --locked

  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [verify-release, frontend-checks, backend-checks]

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        service: [api, web]

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: infra/docker/${{ matrix.service }}.prod.Dockerfile
          platforms: linux/amd64
          push: true
          # One package version per release, so retention can count releases.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: >-
            ${{ needs.verify-release.outputs.registry_prefix }}/anatomy-${{ matrix.service }}:${{ needs.verify-release.outputs.release }}

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    needs: [verify-release, build]

    outputs:
      previous: ${{ steps.deploy.outputs.previous }}

    steps:
      - name: Validate deployment transport
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.ANATOMY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.ANATOMY_DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANATOMY_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.ANATOMY_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "${DEPLOY_HOST}"
          [[ "${DEPLOY_PORT}" =~ ^[0-9]+$ ]]
          test -n "${DEPLOY_KNOWN_HOSTS}"
          test -n "${DEPLOY_KEY}"

      - name: Deploy release
        id: deploy
        shell: bash
        env:
          RELEASE: ${{ needs.verify-release.outputs.release }}
          DEPLOY_HOST: ${{ vars.ANATOMY_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.ANATOMY_DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.ANATOMY_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.ANATOMY_DEPLOY_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          umask 077

          SSH_DIR="${RUNNER_TEMP}/anatomy-ssh"
          trap 'rm -rf "${SSH_DIR}"' EXIT
          mkdir -p "${SSH_DIR}"
          printf '%s\n' "${DEPLOY_KEY}" > "${SSH_DIR}/id_ed25519"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "${SSH_DIR}/known_hosts"

          # The server's forced command accepts only "deploy vX.Y.Z".
          ssh \
            -p "${DEPLOY_PORT}" \
            -i "${SSH_DIR}/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${SSH_DIR}/known_hosts" \
            -o ConnectTimeout=15 \
            anatomy-deploy@"${DEPLOY_HOST}" \
            "deploy ${RELEASE}" < /dev/null | tee "${RUNNER_TEMP}/deploy.log"

          previous="$(sed -n 's/^PREVIOUS_RELEASE=//p' "${RUNNER_TEMP}/deploy.log" | tail -n1)"
          echo "previous=${previous}" >> "${GITHUB_OUTPUT}"

  ghcr-retention:
    name: Remove older GHCR images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [verify-release, deploy-production]

    permissions:
      packages: write

    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      CURRENT: ${{ needs.verify-release.outputs.release }}
      PREVIOUS: ${{ needs.deploy-production.outputs.previous }}

    steps:
      - name: Keep the deployed release and the one before it
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "$(gh api "/users/${OWNER}" --jq .type)" == "Organization" ]]; then
            base="/orgs/${OWNER}/packages/container"
          else
            base="/users/${OWNER}/packages/container"
          fi

          for image in anatomy-api anatomy-web; do
            versions="$(gh api --paginate "${base}/${image}/versions?per_page=100" | jq -s 'add')"

            # Never delete anything unless the release just deployed is listed.
            jq -e --arg current "${CURRENT}" \
              'any(.[]; any(.metadata.container.tags[]?; . == $current))' <<<"${versions}" >/dev/null || {
              echo "${image}: ${CURRENT} not found in GHCR; skipping cleanup." >&2
              continue
            }

            jq -r --arg current "${CURRENT}" --arg previous "${PREVIOUS}" '
              .[] | select(all(.metadata.container.tags[]?; . != $current and . != $previous))
              | "\(.id) \(.metadata.container.tags | join(",") | if . == "" then "(untagged)" else . end)"
            ' <<<"${versions}" |
              while read -r id label; do
                gh api --method DELETE "${base}/${image}/versions/${id}" >/dev/null
                echo "deleted ${image} ${label}"
              done
            echo "${image}: kept ${CURRENT}${PREVIOUS:+ and ${PREVIOUS}}"
          done
