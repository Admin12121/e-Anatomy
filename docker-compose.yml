name: ${COMPOSE_PROJECT_NAME:-anatomy}

x-redis-healthcheck: &redis-healthcheck
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 10

x-api-healthcheck: &api-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health/ready || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

x-web-healthcheck: &web-healthcheck
  test:
    [
      "CMD-SHELL",
      "bun -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
    ]
  interval: 10s
  timeout: 5s
  retries: 20
  start_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-anatomy}
      POSTGRES_USER: ${POSTGRES_USER:-anatomy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anatomy}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anatomy} -d ${POSTGRES_DB:-anatomy}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anatomy

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck: *redis-healthcheck
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - anatomy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    working_dir: /workspace/services/api
    command: cargo watch -x run
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://anatomy:anatomy@postgres:5432/anatomy}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,dicom_object::meta=error}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-anatomy_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin@#12}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Admin}
      INTERNAL_WEB_API_KEY: ${INTERNAL_WEB_API_KEY:-anatomy-internal-web-key-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *api-healthcheck
      start_period: 5m
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./services/api:/workspace/services/api
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - api_target:/workspace/services/api/target
    networks:
      - anatomy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    working_dir: /workspace/apps/web
    command: sh -lc "bun install --frozen-lockfile && bun run auth:bootstrap && bun run dev"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://anatomy:anatomy@postgres:5432/anatomy}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-${DATABASE_URL:-postgres://anatomy:anatomy@postgres:5432/anatomy}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-anatomy_better_auth_dev_secret_that_is_long_enough}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:88}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:88,http://localhost:3000}
      BETTER_AUTH_PASSKEY_RP_ID: ${BETTER_AUTH_PASSKEY_RP_ID:-localhost}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin@#12}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Admin}
      BOOTSTRAP_ADMIN_ACCOUNT_SLUG: ${BOOTSTRAP_ADMIN_ACCOUNT_SLUG:-platform-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-Anatomy Platform <no-reply@localhost>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Anatomy Platform <no-reply@localhost>}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8080/api/v1}
      INTERNAL_WEB_API_KEY: ${INTERNAL_WEB_API_KEY:-anatomy-internal-web-key-dev-only}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_ANALYTICS_COLLECTION_ENABLED: ${NEXT_PUBLIC_ANALYTICS_COLLECTION_ENABLED:-true}
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-/api/v1/public/analytics/events}
      NEXT_SERVER_API_PROXY_TARGET: ${NEXT_SERVER_API_PROXY_TARGET:-http://api:8080}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      <<: *web-healthcheck
      start_period: 20s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/workspace/apps/web
      - web_node_modules:/workspace/apps/web/node_modules
      - web_next_cache:/workspace/apps/web/.next
    networks:
      - anatomy

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-88}:88"
    volumes:
      - ./infra/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - anatomy

  redis-prod:
    profiles: ["prod"]
    image: redis:7-alpine
    command: redis-server --bind 127.0.0.1 --save 60 1 --loglevel warning
    healthcheck: *redis-healthcheck
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis_prod_data:/data

  api-prod:
    profiles: ["prod"]
    # Releases run the CI image for ANATOMY_RELEASE; setup.sh builds :local.
    image: ${ANATOMY_REGISTRY_PREFIX:-ghcr.io/admin12121}/anatomy-api:${ANATOMY_RELEASE:-local}
    build:
      context: .
      dockerfile: infra/docker/api.prod.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
      REDIS_URL: ${REDIS_URL:-redis://127.0.0.1:6379}
      SERVER_HOST: ${SERVER_HOST:-127.0.0.1}
      SERVER_PORT: ${SERVER_PORT:-8080}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn,dicom_object::meta=error}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-anatomy_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-168}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Admin}
      INTERNAL_WEB_API_KEY: ${INTERNAL_WEB_API_KEY:-}
      STORAGE_ROOT_DIR: /app/data
    depends_on:
      redis-prod:
        condition: service_healthy
    healthcheck: *api-healthcheck
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HOST_API_DATA_DIR:-/srv/anatomy/api-data}:/app/data

  web-prod:
    profiles: ["prod"]
    image: ${ANATOMY_REGISTRY_PREFIX:-ghcr.io/admin12121}/anatomy-web:${ANATOMY_RELEASE:-local}
    build:
      context: .
      dockerfile: infra/docker/web.prod.Dockerfile
    command: sh -lc "bun run auth:bootstrap && bun run start -- -H ${WEB_HOST:-127.0.0.1} -p ${WEB_PORT:-3000}"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:-${DATABASE_URL:-}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
      BETTER_AUTH_PASSKEY_RP_ID: ${BETTER_AUTH_PASSKEY_RP_ID:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Platform Admin}
      BOOTSTRAP_ADMIN_ACCOUNT_SLUG: ${BOOTSTRAP_ADMIN_ACCOUNT_SLUG:-platform-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://127.0.0.1:8080/api/v1}
      INTERNAL_WEB_API_KEY: ${INTERNAL_WEB_API_KEY:-}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_PUBLIC_ANALYTICS_COLLECTION_ENABLED: ${NEXT_PUBLIC_ANALYTICS_COLLECTION_ENABLED:-false}
      NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${NEXT_PUBLIC_ANALYTICS_ENDPOINT:-}
      NEXT_SERVER_API_PROXY_TARGET: ${NEXT_SERVER_API_PROXY_TARGET:-http://127.0.0.1:8080}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NODE_ENV: production
    depends_on:
      api-prod:
        condition: service_healthy
    healthcheck: *web-healthcheck
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HOST_UPLOADS_DIR:-/srv/anatomy/uploads}:/workspace/apps/web/public/playground-uploads

  nginx-prod:
    profiles: ["prod"]
    image: nginx:1.29-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${NGINX_PROD_CONF:-./infra/nginx/prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${HOST_UPLOADS_DIR:-/srv/anatomy/uploads}:/srv/anatomy/uploads:ro
      - ${HOST_CERTBOT_WEBROOT:-/srv/anatomy/certbot/www}:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  redis_data:
  redis_prod_data:
  cargo_registry:
  cargo_git:
  api_target:
  web_node_modules:
  web_next_cache:

networks:
  anatomy:
    driver: bridge
