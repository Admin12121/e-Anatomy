name: ${COMPOSE_PROJECT_NAME:-anatomy}

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - anatomy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.prod.Dockerfile
    env_file:
      - ${DEPLOY_ENV_FILE:-.env}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${SERVER_PORT:-8080}
      STORAGE_ROOT_DIR: /app/data
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v1/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    restart: unless-stopped
    volumes:
      - ${HOST_API_DATA_DIR:-/srv/anatomy/api-data}:/app/data
    networks:
      - anatomy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.prod.Dockerfile
    command: sh -lc "bun run auth:bootstrap && bun run start"
    env_file:
      - ${DEPLOY_ENV_FILE:-.env}
    environment:
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://api:8080/api/v1}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      NEXT_SERVER_API_PROXY_TARGET: ${NEXT_SERVER_API_PROXY_TARGET:-http://api:8080}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - ${HOST_UPLOADS_DIR:-/srv/anatomy/uploads}:/workspace/apps/web/public/playground-uploads
    networks:
      - anatomy

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
    restart: unless-stopped
    volumes:
      - ./infra/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - anatomy

volumes:
  redis_data:

networks:
  anatomy:
    driver: bridge
