[package]
name = "api"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
async-stream = "0.3.6"
axum = { version = "0.8.6", features = ["http1", "json", "macros", "multipart", "tokio"] }
axum-extra = { version = "0.12.1", features = ["cookie"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
dicom = { version = "0.9.1", features = ["image"] }
futures-core = "0.3.31"
image = "0.25.6"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["chrono", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0.17"
time = "0.3.44"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zip = "2.4.2"

[profile.dev.package.dicom-pixeldata]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.ravif]
opt-level = 3
